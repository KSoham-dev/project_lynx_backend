name: Trigger auto deployment for prahari-ai-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/prahari-ai-dev-AutoDeployTrigger-e36fd67d-7549-41a7-8923-748582fb4b75.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.PRAHARIAIDEV_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ca157bb2d22eacr.azurecr.io
          registryUsername: ${{ secrets.PRAHARIAIDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PRAHARIAIDEV_REGISTRY_PASSWORD }}
          containerAppName: prahari-ai-dev
          resourceGroup: prahari-ai-fastapi-rg
          imageToBuild: ca157bb2d22eacr.azurecr.io/ca157bb2d22eacr.azurecr.io/prahari-ai-dev:${{ github.sha }}
          
            

     

